# Tick-probe: ВРЕМЕННЫЙ эксперимент (удалить после замера).
# Гипотеза: редкие кроны выживают чаще частых (планировщик GitHub молча
# дропает тики под нагрузкой; duty-крон */11 материализуется раз в 2.5–9.7ч).
# Метод: два крона в одном файле, run-name фиксирует, КАКОЙ крон родил ран.
# Через 2–3 суток сравнить интервалы рождений */11 vs */31 в списке ранов
# (gh run list --workflow=tick_probe.yml) и удалить файл. Duty не трогает.
name: Tick probe (temporary experiment)
on:
  schedule:
    - cron: '*/11 * * * *'
    - cron: '*/31 * * * *'
  workflow_dispatch: {}
permissions: {contents: none}
run-name: "probe ${{ github.event.schedule }}"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: date -u +"tick=%Y-%m-%dT%H:%M:%SZ schedule=${{ github.event.schedule }}"
