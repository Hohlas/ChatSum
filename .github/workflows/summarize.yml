name: ChatSum scheduled summaries

on:
  schedule:
    # Дежурство лидер+standby (флаги в ветке state): watch до 5 ч мостит
    # зазоры cron. */11 дрейфует по часу (11 взаимно просто с 60) — тики не
    # залипают на штурме начала часа (см. доки GitHub про high load).
    - cron: '*/11 * * * *'   # UTC
  workflow_dispatch:          # ручной запуск из UI
    inputs:
      chat_id:
        description: 'Только для ручного прогона конкретного чата'
        required: false
      period:
        description: 'Период (1d, 12h)'
        required: false
      poll_interval:
        description: 'Пауза между опросами inbox в режиме --watch, сек (по умолч. 30)'
        required: false
        default: '30'
      watch_seconds:
        description: 'Длительность цикла --watch, сек (по умолч. 18000 = 5 ч)'
        required: false
        default: '18000'

permissions:
  contents: write

# Параллельность РАЗРЕШЕНА осознанно: перекрытие ранов — суть дежурства.
# Гонки гасит handoff (leader.json): живёт один лидер, остальные выходят.
# Убирать этот комментарий и возвращать concurrency — только вместе с
# возвратом коротких ранов.

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 ч: watch 5 ч + установка + хвостовой анализ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - run: pip install -r requirements.txt

      # принести state.json из ветки state ВО ВНЕ рабочего дерева ($RUNNER_TEMP),
      # чтобы untracked-файл не конфликтовал с git checkout при Persist
      # checkout@v4 по умолчанию делает shallow single-branch fetch без wildcard-refspec,
      # поэтому `git fetch origin state` НЕ создаёт origin/state — используем явный refspec.
      - name: Fetch state
        run: |
          git fetch --depth=1 origin +refs/heads/state:refs/remotes/origin/state 2>/dev/null || true
          git show origin/state:state.json > "$RUNNER_TEMP/state.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/state.json"

      - name: Run due summaries
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE:    ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY1:   ${{ secrets.GOOGLE_API_KEY1 }}
          GOOGLE_API_KEY2:   ${{ secrets.GOOGLE_API_KEY2 }}
          GOOGLE_API_KEY3:   ${{ secrets.GOOGLE_API_KEY3 }}
          GOOGLE_API_KEYS:   ${{ secrets.GOOGLE_API_KEYS }}
          GEMINI_MODEL:      ${{ vars.GEMINI_MODEL }}
          GEMINI_TEMPERATURE:      ${{ vars.GEMINI_TEMPERATURE }}
          GEMINI_REASONING_EFFORT: ${{ vars.GEMINI_REASONING_EFFORT }}
          GEMINI_CHUNK_MAX_CHARS:  ${{ vars.GEMINI_CHUNK_MAX_CHARS }}
          # inputs передаём через env, НЕ через интерполяцию ${{ }} в shell
          # (защита от quoting/инъекций; пустой period → дефолт 1d)
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          PERIOD:  ${{ github.event.inputs.period }}
          POLL_INTERVAL:  ${{ github.event.inputs.poll_interval }}
          WATCH_SECONDS:  ${{ github.event.inputs.watch_seconds }}
          # run_once.py читает/пишет state по этому пути (вне рабочего дерева)
          STATE_PATH: ${{ runner.temp }}/state.json
          # handoff лидерства через Contents API ветки state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$CHAT_ID" ]; then
            python run_once.py --chat-id "$CHAT_ID" --period "${PERIOD:-1d}"
          else
            # только цифры, иначе дефолты run_once.py (защита от инъекций);
            # сначала подставить дефолт в саму переменную: case проверяет
            # раскрытое значение, но присваивает сырое — пустая строка
            # от schedule-событий иначе проскочила бы в argparse как ''.
            POLL_INTERVAL="${POLL_INTERVAL:-30}"
            case "$POLL_INTERVAL" in ''|*[!0-9]*) POLL_INTERVAL=30 ;; esac
            WATCH_SECONDS="${WATCH_SECONDS:-18000}"
            case "$WATCH_SECONDS" in ''|*[!0-9]*) WATCH_SECONDS=18000 ;; esac
            python run_once.py --watch --poll-interval "$POLL_INTERVAL" --watch-seconds "$WATCH_SECONDS"
          fi

      # state.json должен попасть в ветку state даже при частичном провале:
      # успешные задачи уже записаны в файл, а упавшая останется для повтора.
      - name: Persist state
        if: ${{ !cancelled() }}
        run: |
          # state.json лежит в $RUNNER_TEMP (вне дерева) — см. Fetch state.
          # ВАЖНО: при первом запуске git checkout --orphan НЕ очищает дерево,
          # поэтому используем read-tree --empty, иначе весь код попадёт в ветку state.
          git config user.name  "chatsum-bot"
          git config user.email "chatsum-bot@users.noreply.github.com"
          if git fetch --quiet --depth=1 origin +refs/heads/state:refs/remotes/origin/state 2>/dev/null; then
            git checkout -B state origin/state
          else
            git checkout --orphan state
            git read-tree --empty
          fi
          # ветка state содержит только state.json
          cp "$RUNNER_TEMP/state.json" state.json
          git add -f state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin state || {
            echo "non-fast-forward (гонка) — rebase и повторный push"
            git pull --rebase origin state || true
            git push origin state || true
          }